services:
  api:
    image: ${CURATOR_API_IMAGE:?}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:?}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:?}
      FileStorage__ServiceUrl: ${FILE_STORAGE_SERVICE_URL:?}
      FileStorage__Region: ${FILE_STORAGE_REGION:?}
      FileStorage__Bucket: ${FILE_STORAGE_BUCKET:?}
      FileStorage__AccessKey: ${FILE_STORAGE_ACCESS_KEY:?}
      FileStorage__SecretKey: ${FILE_STORAGE_SECRET_KEY:?}
      FileStorage__PublicBaseUrl: ${FILE_STORAGE_PUBLIC_BASE_URL:?}
      FileStorage__ForcePathStyle: ${FILE_STORAGE_FORCE_PATH_STYLE:?}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
