services:
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # С PostgreSQL 18 данные лежат в /var/lib/postgresql/18/docker,
      # поэтому volume монтируется на уровень выше, а не в /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  storage:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${FileStorage__AccessKey:?}
      RUSTFS_SECRET_KEY: ${FileStorage__SecretKey:?}
    ports:
      - "${FILE_STORAGE_PORT:-9000}:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  storage-init:
    image: amazon/aws-cli:2.40.3
    environment:
      AWS_ACCESS_KEY_ID: ${FileStorage__AccessKey:?}
      AWS_SECRET_ACCESS_KEY: ${FileStorage__SecretKey:?}
      AWS_DEFAULT_REGION: ${FileStorage__Region:?}
      AWS_ENDPOINT_URL: http://storage:9000
      BUCKET: ${FileStorage__Bucket:?}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3api head-bucket --bucket "$$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$$BUCKET"
        aws s3api put-bucket-policy --bucket "$$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$BUCKET/*\"]}]}"
    depends_on:
      storage:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  storage-data:
